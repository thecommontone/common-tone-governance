# B♭ Trumpet — Composer's Field Guide spec.
# Driving file for the composer-instrument-guide skill.
# Pitches are in WRITTEN form (treble clef as the trumpet reads it).

instrument:
  name: B♭ Trumpet
  family: brass
  clef: treble
  transposition_blurb: "sounds M2 lower than written"
  sounding_blurb: "E3 – B♭5 (concert) — i.e., a written C4 sounds B♭3 (concert)."

  # The transposition rule: written is one major second HIGHER than concert.
  transposition:
    written_higher_than_concert: M2
    written_example_key: D
    concert_example_key: C
    written_example_pitches: ["d5", "f#5"]    # D major: root + 3rd
    concert_example_pitches: ["c5", "e5"]     # C major: root + 3rd
    written_chord_label: "D"
    concert_chord_label: "C"

intro:
  paragraph: >
    The B♭ trumpet is the standard trumpet in concert band, brass quintet, jazz of every
    flavour, and most orchestral writing from the late nineteenth century onward. It is
    a piston-valve, mostly cylindrical-bore brass instrument with a bright, projecting
    sound. Three valves give the player full chromatic access; lip-and-air alone select
    the harmonic series above each fingering. The single thing you must internalize before
    writing for it
  paragraph_emphasis: "the B♭ trumpet sounds a major 2nd lower than written."

voice:
  paragraph: >
    The trumpet is the orchestra's trumpet — its very name is a verb in many languages.
    It speaks in two voices: the public proclamation (fanfares, calls to attention,
    arrivals) and the private ache (Miles with the Harmon mute, lyrical solos in soft
    dynamics). The instrument is built for projection; making it sound intimate is a
    learned art and a particularly idiomatic one.
  signature_gestures:
    - "The fanfare — open intervals, dotted rhythms, repeated tonic-and-dominant"
    - "The Miles ballad — Harmon mute, soft mid-register, behind-the-beat phrasing"
    - "The high arrival — sustained C5 or above at climaxes, often unison with horns"
    - "The jazz lead — articulated 16ths, double-tongued figures, blue inflections"
  archetypal_uses:
    - "Fanfares & arrivals (Mahler 5 opening, Strauss Also sprach Zarathustra)"
    - "Heroic / military (Beethoven Leonore Overture No. 3, Mahler 3 finale)"
    - "Jazz solo voice (Miles Davis, Clifford Brown, Wynton Marsalis)"
    - "Lyrical interior (Mahler 5 Adagietto echoes; Copland's Quiet City)"

players_pov:
  paragraph: >
    Trumpet players think about the lip — the embouchure — the way a marathon runner
    thinks about the legs. The lip is the muscle that fails first, and once it does,
    nothing the player can do recovers it inside the same piece. They love clean
    on-ramps to high passages (a few bars of mid-register first to set the embouchure),
    they love rest before exposed soft entrances, and they love being trusted with a
    quiet beautiful line — the trumpet is more often asked to play LOUD than asked to
    play BEAUTIFUL, and a lyrical melody is a gift to a trumpet player.

history:
  origin: >
    The trumpet's lineage runs back to military and ceremonial signal-instruments —
    natural (valveless) trumpets and bugles whose pitch material was limited to the
    harmonic series above whatever fundamental tube length was in use. The valve era,
    starting in the 1810s, transformed it into the chromatic instrument we know.
  timeline:
    - {era: "antiquity–1810s", note: "Natural trumpet (no valves); fanfares and signal calls only"}
    - {era: "late 18th c.",   note: "Keyed trumpet briefly bridges to chromaticism (Haydn, Hummel concertos)"}
    - {era: "1815",           note: "Stölzel & Blühmel patent valve mechanism — soon adapted for trumpet"}
    - {era: "mid 19th c.",    note: "Valve trumpets in many keys (F, E♭, D, C, B♭) coexist"}
    - {era: "ca. 1900",       note: "B♭ and C trumpets dominate orchestra and band"}
    - {era: "20th c.",        note: "Piccolo trumpet revived; mute family explodes (Harmon, Plunger, Bucket) in jazz"}
  family_tree: "Cornet · Flugelhorn · Piccolo trumpet · C trumpet · E♭ trumpet (modern siblings) · Natural trumpet · Keyed trumpet · Bugle · Posthorn (period ancestors)"

definition_box:
  title: "Transposition (in plain English)"
  body: >
    Write the trumpet part one whole step (M2) HIGHER than the concert pitch you want
    to hear. If you want to hear concert C, write D for the trumpet. Key signatures
    shift by the same amount: concert F major (1 flat) is written as G major (1 sharp)
    for the trumpet.

asides:
  - kind: pedantry
    title: "Pedestal of Pedantry — Why B♭?"
    body: >
      Trumpets used to come in many lengths (C, D, E♭, F, G, A, B♭) so a single horn
      could match any key. The B♭ length won out for orchestral and band work because
      it sits in a sweet spot of tubing length: short enough to be brilliant, long enough
      to be warm, and centred on the keys most band music sits in. C trumpets are common
      in orchestral and chamber work; piccolo (high B♭/A) and E♭ trumpets show up for
      specific repertoire. Treat 'the trumpet' as B♭ unless told otherwise.

# Zones in the range diagram. ORDER LOW → HIGH in YAML for human readability;
# the renderer flips the legend to read HIGH → LOW automatically.
zones:
  - name: "Pedal / sub-pedal"
    written_range: ["C3", "F3"]
    color: "#E0E0E0"
    border: "#A0A0A0"
    danger: "x"
    blurb: "Below the practical horn. Lip-bent fundamentals; specialist effect only."

  - name: "Low register (stuffy)"
    written_range: ["F#3", "C4"]
    color: "#F8C8B0"
    border: "#D88E66"
    danger: "!!"
    blurb: "Tone is thick and resistant. Soft dynamics are very hard. Avoid sustained pp."

  - name: "Middle (the sweet spot)"
    written_range: ["C#4", "G5"]
    color: "#C8E6C8"
    border: "#5DC06E"
    danger: "✓"
    blurb: "Resonant, flexible, agile. Most idiomatic writing lives here."

  - name: "Upper register"
    written_range: ["G#5", "C6"]
    color: "#BFD8F0"
    border: "#4A90D9"
    danger: "!"
    blurb: "Brilliant and athletic; costs stamina. Plan rest before & after."

  - name: "Altissimo / extreme"
    written_range: ["C#6", "E6"]
    color: "#F4B6C2"
    border: "#D96BA0"
    danger: "!!!"
    blurb: "Lead-trumpet territory. Brief moments only; never a default."

range_caption: >
  The chart above is in WRITTEN pitch. The practical professional range is F♯3 to C6
  (written). Skilled players go higher — and student players don't. When in doubt,
  write in the green band (the middle register). Reserve C5 and above for moments
  of genuine arrival; reserve everything above G5 for short, prepared statements.
  The high register costs stamina nonlinearly: a single high B♭ can be cheap, while
  two minutes of writing in the upper register will exhaust even a strong player.

articulation:
  - name: "Single tongue"
    description: "default articulation. Effective up to roughly ♩=144 in 16ths."
  - name: "Double tongue (T-K-T-K)"
    description: "for fast 16th-note passages above ♩≈144. Standard, expected technique."
  - name: "Triple tongue (T-T-K or T-K-T)"
    description: "for fast triplets. Equally standard."
  - name: "Slurs / lip slurs"
    description: "smooth slurs across the same fingering (between partials) are the most legato gesture available."
  - name: "Flutter tongue (Frullato / Flz.)"
    description: "rolled R against the air stream; reads as 'growl'. Stays in lower-to-middle register; difficult above the staff."
  - name: "Half-valve"
    description: "pitch becomes pinched and ambiguous; classic jazz colour, also useful for ghost notes and bent gestures."
  - name: "Pitch bends, glissandi, falls, doits, scoops"
    description: "readily available, especially in jazz writing. A true valve glissando spans only the partials available on a single fingering."
  - name: "Vibrato"
    description: "almost always present; controlled by lip and (in jazz) hand. You generally do NOT need to ask for it."

mutes:
  - name: "Straight"
    sound: "Bright, focused, slightly nasal — the default 'muted' trumpet."
    notation: "con sord. (straight) … senza sord."
  - name: "Cup"
    sound: "Soft, distant, gauzy — pulls the edge off everything."
    notation: "con sord. (cup)"
  - name: "Harmon (no stem)"
    sound: "Buzzy, bee-in-a-jar — Miles Davis sound; very intimate."
    notation: "(harmon, no stem)"
  - name: "Harmon (with stem)"
    sound: "Brighter, more cutting; stem can be moved for wah effect."
    notation: "(harmon, stem in/out)"
  - name: "Plunger"
    sound: "Player covers the bell with a rubber plunger; vocal 'wah' shapes."
    notation: "+ (closed) o (open)"
  - name: "Bucket"
    sound: "Dark, woolly, mellow — like the sound is wrapped in felt."
    notation: "(bucket mute)"

mute_caveat: >
  Two universal rules: (1) it takes a player 1–2 seconds to insert or remove a mute —
  leave a rest. (2) Always specify which mute by name; 'con sord.' alone defaults to
  a straight mute, which may not be what you want.

phrasing:
  - "Reasonable breath at moderate dynamic: 4–8 bars at ♩=72. Less when loud, less again when high."
  - "Stamina is the silent killer. The lips are a muscle and they tire. Long unbroken passages, especially above the staff, are the chief cause of bad performances."
  - "Build in rest. Even 4–8 bars of silence between intense moments lets the player recover. Trumpet players will love you for this."
  - "After a long high passage, give the player 1–2 bars before any exposed soft entrance — the lips need to 'set' again."

pitfalls:
  - "Asking for sustained pp below the staff (the low register is stuffy and resistant — soft dynamics are very hard there)"
  - "Writing 'con sord.' without specifying which mute (defaults to straight, which may not be what you want)"
  - "Forgetting recovery time after a sustained passage above the staff"
  - "Treating high notes as cheap — a single high B♭ is fine; two minutes of writing above G5 is exhausting"
  - "Asking for vibrato explicitly (trumpet players will add appropriate vibrato by default)"

listen:
  - {piece: "Mahler — Symphony No. 5, opening", role: "the iconic solo trumpet fanfare (the most famous opening in symphonic literature)"}
  - {piece: "Strauss — Also sprach Zarathustra, opening", role: "the C-G-C arrival fanfare ('2001' opening)"}
  - {piece: "Copland — Quiet City", role: "lyrical solo trumpet over strings — proof that trumpet can speak intimately"}
  - {piece: "Miles Davis — Kind of Blue", role: "the trumpet as ballad voice, Harmon mute throughout"}
  - {piece: "Stravinsky — Petrushka, 'Russian Dance'", role: "brilliant, articulated trumpet writing in dance"}
  - {piece: "Hummel — Trumpet Concerto in E♭", role: "the keyed-trumpet solo concerto that anticipated the valve era"}

checklist:
  title: "Composer's first-pass checklist"
  items:
    - "Did you transpose? Wrote the part one whole step higher than concert?"
    - "Stay in the green zone unless you have a reason. Save high register for arrivals."
    - "Counted rests by minute. If you can't, the player can't either."
    - "Specified the mute by name and left time to put it in."
    - "No sustained pp below the staff. No sustained ff in the altissimo."

     font-weight="bold"
     font-style="normal"
     fill="#222"
     text-anchor="start"
     id="text74">Pedal / sub-pedal  (C3–F3)</text>
  <text
     x="704.0"
     y="58.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"

     font-weight="bold"
     font-style="normal"
     fill="#222"
     text-anchor="start"
     id="text114">Sounding range:</text>
  <text
     x="108.0"
     y="334.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="9.5"
     font-weight="normal"
     font-style="normal"
     fill="#333"
     text-anchor="start"
     id="text116">E3 – B♭5 (concert) — i.e., a written C4 sounds B♭3 (concert).</text>

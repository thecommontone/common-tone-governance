     text-anchor="end"
     id="text76">x</text>
  <text
     x="300.0"
     y="70.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="8.5"
     font-weight="normal"
     font-style="normal"
     fill="#444"
     text-anchor="start"
     id="text78">Below the practical horn. Lip-bent fundamentals; specialist effect only.</text>
  <rect
     x="282.0"
     y="79.0"
     width="12.0"
     height="11.0"
     rx="0"
     fill="#F8C8B0"
     stroke="#D88E66"
     opacity="0.85"
     id="rect80" />
  <text
     x="300.0"
     y="88.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"
     fill="#222"
     text-anchor="start"
     id="text82">Low register (stuffy)  (F#3–C4)</text>
  <text
     x="704.0"
     y="88.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"
     fill="#D33"
     text-anchor="end"
     id="text84">!!</text>
  <text
     x="300.0"
     y="100.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="8.5"
     font-weight="normal"
     font-style="normal"
     fill="#444"
     text-anchor="start"
     id="text86">Tone is thick and resistant. Soft dynamics are very hard. Avoid sustained pp.</text>
  <rect
     x="282.0"
     y="109.0"
     width="12.0"
     height="11.0"
     rx="0"
     fill="#C8E6C8"
     stroke="#5DC06E"
     opacity="0.85"
     id="rect88" />
  <text
     x="300.0"
     y="118.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"
     fill="#222"
     text-anchor="start"
     id="text90">Middle (the sweet spot)  (C#4–G5)</text>
  <text
     x="704.0"
     y="118.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"
     fill="#777"
     text-anchor="end"
     id="text92">✓</text>
  <text
     x="300.0"
     y="130.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="8.5"
     font-weight="normal"
     font-style="normal"
     fill="#444"
     text-anchor="start"
     id="text94">Resonant, flexible, agile. Most idiomatic writing lives here.</text>
  <rect
     x="282.0"
     y="139.0"
     width="12.0"
     height="11.0"
     rx="0"
     fill="#BFD8F0"
     stroke="#4A90D9"
     opacity="0.85"
     id="rect96" />
  <text
     x="300.0"
     y="148.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"
     fill="#222"
     text-anchor="start"
     id="text98">Upper register  (G#5–C6)</text>
  <text
     x="704.0"
     y="148.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"
     fill="#D33"
     text-anchor="end"
     id="text100">!</text>
  <text
     x="300.0"
     y="160.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="8.5"
     font-weight="normal"
     font-style="normal"
     fill="#444"
     text-anchor="start"
     id="text102">Brilliant and athletic; costs stamina. Plan rest before &amp; after.</text>
  <rect
     x="282.0"
     y="169.0"
     width="12.0"
     height="11.0"
     rx="0"
     fill="#F4B6C2"
     stroke="#D96BA0"
     opacity="0.85"
     id="rect104" />
  <text
     x="300.0"
     y="178.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"
     fill="#222"
     text-anchor="start"
     id="text106">Altissimo / extreme  (C#6–E6)</text>
  <text
     x="704.0"
     y="178.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="10"
     font-weight="bold"
     font-style="normal"
     fill="#D33"
     text-anchor="end"
     id="text108">!!!</text>
  <text
     x="300.0"
     y="190.0"
     font-family="Gill Sans, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif"
     font-size="8.5"
     font-weight="normal"
     font-style="normal"
     fill="#444"
     text-anchor="start"
     id="text110">Lead-trumpet territory. Brief moments only; never a default.</text>
